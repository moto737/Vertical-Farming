<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plant care cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6e3; --bg2:#c9d3cf; --ink:#1c2422; --muted:#5b6965; --line:#b8c4c0;
  --panel:rgba(247,250,249,.88); --panel-solid:#f4f7f6; --accent:#2e7d4f; --accent-ink:#ffffff;
  --water:#2f7fd8; --treat:#c98a0c; --warn:#e8670c; --track:#d3dcd9;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a201f; --bg2:#101413; --ink:#e6ecea; --muted:#9aa8a4; --line:#33403c;
    --panel:rgba(28,35,33,.9); --panel-solid:#1f2725; --accent:#4fae75; --accent-ink:#0d1a13;
    --water:#5aa6f0; --treat:#e8b23a; --track:#33403c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a201f; --bg2:#101413; --ink:#e6ecea; --muted:#9aa8a4; --line:#33403c;
  --panel:rgba(28,35,33,.9); --panel-solid:#1f2725; --accent:#4fae75; --accent-ink:#0d1a13;
  --water:#5aa6f0; --treat:#e8b23a; --track:#33403c; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 40% 30%,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;font-size:15px;line-height:1.4}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}

.head{position:fixed;left:20px;top:calc(env(safe-area-inset-top,0px) + 18px);max-width:min(460px,calc(100% - 330px));pointer-events:none}
.head h1{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1;margin:0;letter-spacing:-.01em}
.status{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.status.live .dot{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.status.water .dot{background:var(--water);box-shadow:0 0 0 4px color-mix(in srgb,var(--water) 25%,transparent)}
.status.treat .dot{background:var(--treat);box-shadow:0 0 0 4px color-mix(in srgb,var(--treat) 25%,transparent)}
.tally{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:14px;color:var(--muted)}
.tally b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.side{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);width:270px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.feed{position:relative;height:176px;border-radius:12px;border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.feed span{position:absolute;left:8px;top:7px;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:6px}
.feed i{position:absolute;right:9px;top:10px;width:8px;height:8px;border-radius:50%;background:#e33}

.data{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:12px 14px 13px;
  box-shadow:0 6px 24px rgba(0,0,0,.14);transform-origin:top right;transition:opacity .25s ease,transform .3s cubic-bezier(.2,.9,.3,1.2);opacity:0;transform:scale(.92) translateY(-6px)}
.data.open{opacity:1;transform:none}
.data .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.data .id{font-family:"Barlow Semi Condensed","Barlow",sans-serif;font-weight:600;font-size:21px;line-height:1.1}
.data .sp{color:var(--muted);font-size:14px}
.chip{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.chip.water{background:color-mix(in srgb,var(--water) 18%,transparent);color:var(--water)}
.chip.treat{background:color-mix(in srgb,var(--treat) 20%,transparent);color:var(--treat)}
.chip.ok{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.meter{margin-top:12px}
.meter .lbl{display:flex;justify-content:space-between;font-size:14px}
.meter .lbl span{color:var(--muted)}
.meter .lbl strong{font-weight:600;font-variant-numeric:tabular-nums}
.track{position:relative;height:8px;border-radius:5px;background:var(--track);margin-top:5px;overflow:visible}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--water)}
.track b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;left:60%}
.data dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:12px 0 0;font-size:14px}
.data dt{color:var(--muted)}
.data dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.data dd.flag{color:var(--treat);font-weight:600}
.data dd.good{color:var(--accent);font-weight:600}

.dock{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;pointer-events:none}
.bar{pointer-events:auto;display:flex;gap:4px;align-items:center;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:5px}
.bar small{color:var(--muted);font-size:13px;padding:0 4px 0 8px}
button{font:inherit;font-weight:500;color:var(--ink);background:transparent;border:0;border-radius:9px;padding:8px 11px;cursor:pointer;white-space:nowrap}
button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
button[aria-pressed="true"]{background:var(--ink);color:var(--panel-solid)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.run{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:9px 16px}
.run:hover{background:color-mix(in srgb,var(--accent) 85%,var(--ink))}
.run.stop{background:var(--warn);color:#fff}
.farm{font-weight:600}
.sep{width:1px;align-self:stretch;background:var(--line);margin:2px}
.swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
details.joints{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:4px 6px;min-width:240px}
details.joints summary{list-style:none;cursor:pointer;font-weight:600;padding:7px 8px;border-radius:9px;display:flex;justify-content:space-between;gap:16px}
details.joints summary::-webkit-details-marker{display:none}
details.joints summary::after{content:"＋";color:var(--muted);font-weight:400}
details.joints[open] summary::after{content:"－"}
.rows{padding:2px 8px 10px;display:grid;gap:9px}
.row{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:14px}
.row label{color:var(--muted)}
.row output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:22px;margin:0}
#watch{display:contents}
[hidden]{display:none!important}
@media (max-width:760px){
  .head{max-width:calc(100% - 40px)}
  .head h1{font-size:26px}
  .tally{font-size:13px}
  .side{width:170px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);right:10px}
  .feed{height:108px}
  .data{padding:9px 10px;font-size:13px}
  .data .id{font-size:17px}
  .data dl,.meter .lbl{font-size:12.5px}
  details.joints{min-width:0;flex:1 1 100%}
  .bar{flex-wrap:wrap}
  button{padding:7px 9px}
}
@media (prefers-reduced-motion: reduce){ .data{transition:none} }
</style>
</head>
<body>
<canvas id="stage" aria-label="3D scene of mobile robot arms tending potted plants on shelves. Drag to orbit, scroll or pinch to zoom."></canvas>

<div class="head">
  <h1 id="title">Plant care cell</h1>
  <div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">Idle. Run a care cycle to start.</span></div>
  <div class="tally" id="tally"></div>
</div>

<div class="side">
  <div class="feed" id="feed" aria-hidden="true"><span>Tool camera</span><i></i></div>
  <section class="data" id="data" aria-live="polite">
    <div class="top"><span class="id" id="dId">–</span><span class="sp" id="dSp"></span></div>
    <span class="chip" id="dChip">Reading tag</span>
    <div class="meter">
      <div class="lbl"><span>Soil moisture</span><strong id="dMoist">–</strong></div>
      <div class="track"><i id="dFill"></i><b title="Target"></b></div>
    </div>
    <dl>
      <dt>Temperature</dt><dd id="dTemp">–</dd>
      <dt>Humidity</dt><dd id="dHum">–</dd>
      <dt>Leaves</dt><dd id="dLeaf">–</dd>
      <dt>Weeds</dt><dd id="dWeed">–</dd>
    </dl>
  </section>
</div>

<div class="dock">
  <div class="bar">
    <button class="run" id="run">Run care cycle</button>
    <button id="speed" aria-pressed="false">2× speed</button>
  </div>
  <div class="bar" role="group" aria-label="Manual tool controls">
    <button id="waterBtn" aria-pressed="false"><span class="swatch" style="background:var(--water)"></span>Water</button>
    <button id="treatBtn" aria-pressed="false"><span class="swatch" style="background:var(--treat)"></span>Weed and leaf spray</button>
    <button id="scanBtn" aria-pressed="false">Scan</button>
  </div>
  <div class="bar" role="group" aria-label="Camera view">
    <button data-view="overview" aria-pressed="true">Overview</button>
    <button data-view="front" aria-pressed="false">Front</button>
    <button data-view="side" aria-pressed="false">Side</button>
    <button data-view="top" aria-pressed="false">Top</button>
    <button data-view="tool" aria-pressed="false">Follow tool</button>
  </div>
  <div class="bar">
    <button class="farm" id="farmBtn" aria-pressed="false">Show farm</button>
    <span id="watch" hidden><span class="sep"></span><small>Watching</small>
      <button data-row="0" aria-pressed="true">Row 1</button><button data-row="1" aria-pressed="false">Row 2</button><button data-row="2" aria-pressed="false">Row 3</button></span>
  </div>
  <div class="bar"><button id="rigBtn" aria-pressed="false">Switch to scissor lift</button></div>
  <details class="joints" id="joints">
    <summary>Joints and drive</summary>
    <div class="rows" id="rows"></div>
  </details>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function merge(geos){
  const P = [], N = [], I = []; let o = 0;
  geos.forEach(g => {
    const p = g.attributes.position.array, n = g.attributes.normal.array, idx = g.index.array;
    for(let i=0;i<p.length;i++){ P.push(p[i]); N.push(n[i]); }

    o += p.length/3; g.dispose();

  const out = new THREE.BufferGeometry();

const qrCache = {};
function qrTexture(id){
  if(qrCache[id]) return qrCache[id];
  const rows = QR[id], n = rows.length, q = 2, px = 10, size = (n + q*2)*px;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = '#f4f4f2'; g.fillRect(0,0,size,size); g.fillStyle = '#111';
  rows.forEach((r,y) => [...r].forEach((v,x) => { if(v==='1') g.fillRect((x+q)*px,(y+q)*px,px,px); }));
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  return qrCache[id] = t;
}

const LEAF_OK = [.18,.48,.2], LEAF_SICK = [.62,.55,.14], LEAF_SPOT = [.3,.18,.06];
const NU = 12, NV = 8, LV = (NU+1)*(NV+1);
function makePlant(seed){
  const r = rng(seed*977 + 13), g = new THREE.Group();
  const H=.18, RB=.075, RT=.1, WALL=.008, outer = z => RB+(RT-RB)*z/H, inner = z => outer(z)-WALL;
  const prof = [[0,0],[RB-.004,0],[RB,.004],[outer(.15),.15],[outer(.15)+.008,.152],[outer(H)+.008,H-.002],
    [outer(H)+.006,H],[inner(H)+.001,H],[inner(H),H-.002],[inner(.012),.016],[inner(.012)-.004,.012],[0,.012]].map(([a,b]) => new THREE.Vector2(a,b));
  g.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 40), mat.pot));
  const soilMat = M(0x6b4a2e, {roughness:1});
  g.add(cyl(inner(.012)-.003, inner(.15)-.003, .138, soilMat, 'y', [0,.012,0], 1, 32));

  const SOIL = .15, TH = .34 + r()*.06, pts = [], ph = r()*6;
  for(let i=0;i<16;i++){ const t = i/15; pts.push(new THREE.Vector3(.006*Math.sin(t*5+ph), SOIL - .004 + TH*t, .008*Math.sin(t*3.5+ph))); }
  const trunk = new THREE.CatmullRomCurve3(pts), stems = [new THREE.TubeGeometry(trunk, 32, .0065, 8)];
  const up = new THREE.Vector3(0,1,0), P = [], I = [], UV = [], meta = [];
  function leaf(base, dir, L, W, tilt, droop){
    const start = P.length/3;
    const fwd = dir.clone().multiplyScalar(Math.cos(tilt)).addScaledVector(up, Math.sin(tilt));
    const side = new THREE.Vector3().crossVectors(up, dir).normalize();
    for(let i=0;i<=NU;i++){
      const t = i/NU, w = W*Math.pow(Math.sin(Math.PI*t), .65)*(1 - .25*t);
      for(let j=0;j<=NV;j++){
        const u = -1 + 2*j/NV;
        const p = base.clone().addScaledVector(fwd, t*L).addScaledVector(side, u*w/2).addScaledVector(up, Math.abs(u)*w*.2 - t*t*L*droop);
        P.push(p.x, p.y, p.z); UV.push(t, (u+1)/2);
      }
    }
    for(let i=0;i<NU;i++) for(let j=0;j<NV;j++){ const a = start + i*(NV+1)+j, b = a+1, c = a+NV+1, d = c+1; I.push(a,b,d, a,d,c); }
    const mid = base.clone().addScaledVector(fwd, L*.5).addScaledVector(up, -.25*L*droop);

  }
  const a0 = r()*6.28, NL = 12;
  for(let k=0;k<NL;k++){
    const t = .25 + .75*k/(NL-1), node = trunk.getPoint(t), ang = a0 + k*2.399963;
    const dir = new THREE.Vector3(Math.cos(ang), 0, Math.sin(ang)), size = 1 - .45*k/(NL-1);

    stems.push(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(node, node.clone().lerp(end,.5).add(new THREE.Vector3(0,.006,0)), end), 5, .0025, 5));
    leaf(end, dir, .15*size*(.9+r()*.2), .075*size, .35+.6*k/(NL-1), .35);
  }
  leaf(trunk.getPoint(1), new THREE.Vector3(1,0,0), .07, .03, 1.3, .1);
  g.add(new THREE.Mesh(merge(stems), mat.stem));
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  lg.setAttribute('uv', new THREE.Float32BufferAttribute(UV,2));
  const healthy = new Float32Array(P.length);
  for(let v=0; v<P.length/3; v++){ const t = UV[v*2], k = .9 + .2*t; healthy[v*3] = LEAF_OK[0]*k; healthy[v*3+1] = LEAF_OK[1]*k; healthy[v*3+2] = LEAF_OK[2]*k; }
  lg.setAttribute('color', new THREE.BufferAttribute(healthy.slice(), 3));
  lg.setIndex(I); lg.computeVertexNormals();
  g.add(new THREE.Mesh(lg, mat.leaf));

  // weed growing in the front of the pot
  const wx = (r() - .5)*.06, wz = .055, blades = [];
  for(let b=0;b<7;b++){
    const cg = new THREE.ConeGeometry(.006, .05 + r()*.035, 4); cg.translate(0, .03, 0);
    cg.rotateZ((r()-.5)*1.1); cg.rotateY(r()*6.28); cg.rotateX((r()-.5)*.6); blades.push(cg);
  }
  for(let b=0;b<4;b++){
    const lb = new THREE.SphereGeometry(.014, 8, 6); lb.scale(1, .18, .45); lb.translate(.014, .004, 0); lb.rotateY(b*1.57 + r()); blades.push(lb);
  }
  const weedMat = M(0x8dbb3a, {roughness:.6});
  const weed = new THREE.Mesh(merge(blades), weedMat); weed.position.set(wx, SOIL, wz);
  g.add(weed);
  shadowed(g);
  return {group:g, leafGeo:lg, healthy, meta, weed, weedMat, soilMat, weedTop:new THREE.Vector3(wx, SOIL + .045, wz)};
}

const anims = [];

function setDisease(plant, leaves){
  const col = plant.leafGeo.attributes.color;
  leaves.forEach(li => {
    const m = plant.meta[li], uv = plant.leafGeo.attributes.uv.array;
    for(let v=m.start; v<m.start+LV; v++){
      const t = uv[v*2], u = uv[v*2+1];
      const spot = Math.sin(t*23 + li*3)*Math.sin(u*17 + li) > .45;
      const c = spot ? LEAF_SPOT : LEAF_SICK;
      col.array[v*3] = c[0]; col.array[v*3+1] = c[1]; col.array[v*3+2] = c[2];
    }
  });
  col.needsUpdate = true;
}
function healLeaf(plant, li){
  const col = plant.leafGeo.attributes.color, m = plant.meta[li];
  const from = col.array.slice(m.start*3, (m.start+LV)*3);
  return animate(2200, t => {
    for(let k=0; k<LV*3; k++) col.array[m.start*3+k] = from[k] + (plant.healthy[m.start*3+k] - from[k])*t;
    col.needsUpdate = true;
  });
}
function resetLeaves(plant){ plant.leafGeo.attributes.color.array.set(plant.healthy); plant.leafGeo.attributes.color.needsUpdate = true; }

// Planner in the row's local frame. W = wrist pivot, pitch = tool angle below horizontal (deg)
function solve(R, W, pitch, x){
  if(R.kind === 'linear'){
    return {x:W.x, lift:Math.max(SCISSOR.min, Math.min(SCISSOR.max, W.y - .05 + DROP)), ext:Math.max(0, Math.min(.5, R.pose.z - .2 - W.z)), tilt:pitch};

  const a3 = Math.atan2(r - er, h - eh) - a1 - Math.PI/2;

  const pt = Math.atan2(wy - T.y, wz - T.z)/deg;
  return solve(R, new THREE.Vector3(T.x, wy, wz), pt, st.base.x);

const NP = 2400, pPos = new Float32Array(NP*3), pCol = new Float32Array(NP*3), pVel = new Float32Array(NP*3), pLife = new Float32Array(NP), pG = new Float32Array(NP);

pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pCol,3));

  const gr = g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(1,'rgba(255,255,255,0)');

points.frustumCulled = false; scene.add(points);
let pNext = 0;

  for(let k=0;k<n;k++){
    const i = pNext = (pNext+1) % NP, sp = S.speed*(.8 + Math.random()*.4);
    pPos[i*3] = tv.x; pPos[i*3+1] = tv.y; pPos[i*3+2] = tv.z;
    pVel[i*3] = (fw.x + (Math.random()-.5)*S.spread*2)*sp; pVel[i*3+1] = (fw.y + (Math.random()-.5)*S.spread*2)*sp; pVel[i*3+2] = (fw.z + (Math.random()-.5)*S.spread*2)*sp;
    pCol[i*3] = S.col[0]; pCol[i*3+1] = S.col[1]; pCol[i*3+2] = S.col[2]; pLife[i] = .55 + Math.random()*.35; pG[i] = S.g;

function stepParticles(dt){
  const drag = Math.exp(-1.4*dt);

    pLife[i] -= dt; if(pLife[i] <= 0){ pPos[i*3+1] = -50; continue; }
    pVel[i*3] *= drag; pVel[i*3+2] *= drag; pVel[i*3+1] = pVel[i*3+1]*drag - pG[i]*dt;

const SHELF = {w:1.3, d:.55, t:.05, levels:[.10,.78,1.50], postX:[-.55,0,.55]};

function buildModule(row, mi, x0, ri, rand, demo){
  const sh = [];
  sh.push((() => { const g = new THREE.BoxGeometry(1.15,.10,.42); g.translate(0,.05,-.02); return g; })());
  SHELF.levels.forEach(y => { const g = new THREE.BoxGeometry(SHELF.w, SHELF.t, SHELF.d); g.translate(0, y + SHELF.t/2, 0); sh.push(g); });
  SHELF.postX.forEach(x => { const top = SHELF.levels[2], bot = SHELF.levels[0] + SHELF.t;
    const g = new THREE.BoxGeometry(.16, top-bot, .04); g.translate(x, (top+bot)/2, -.18); sh.push(g);
    const t = new THREE.BoxGeometry(.13,.10,.03); t.translate(x, top + SHELF.t + .05, -.18); sh.push(t); });
  const shelf = shadowed(new THREE.Mesh(merge(sh), mat.shelf)); shelf.position.x = x0; row.group.add(shelf);
  const order = [['A1',0,-1],['A2',0,1],['B2',1,1],['B1',1,-1]];
  return order.map(([pos, lvl, s], k) => {
    const id = `R${ri+1}M${mi+1}-${pos}`, x = x0 + .28*s, y = SHELF.levels[lvl] + SHELF.t, z = .02;
    const plant = makePlant(ri*100 + mi*10 + k + 3); plant.group.position.set(x, y, z); row.group.add(plant.group);
    const plaque = new THREE.Group();
    plaque.add(box(.012, .125, .012, mat.grey, 0, -.1075, -.004), box(.05, .006, .03, mat.grey, 0, -.167, -.004));
    const face = new THREE.Mesh(new THREE.BoxGeometry(.09,.09,.006), [mat.plaque,mat.plaque,mat.plaque,mat.plaque,new THREE.MeshStandardMaterial({map:qrTexture(id), roughness:.6}),mat.plaque]);

    const ring = new THREE.Mesh(new THREE.RingGeometry(.072,.08,4,1,Math.PI/4), new THREE.MeshBasicMaterial({color:0x34c27a, transparent:true, opacity:0}));
    ring.position.z = .006; plaque.add(ring);
    plaque.position.set(x + (s < 0 ? .155 : -.155), y + .17, z + .09); row.group.add(plaque);
    const st = {id, species:SPECIES[(ri*4 + mi*3 + k) % SPECIES.length], plant, ring, lvl, base:new THREE.Vector3(x,y,z), tag:plaque.position.clone(), d:{}};

function newDay(st, rand, preset){
  const d = st.d;

  d.moist = p.m; d.target = 60; d.temp = 19.5 + rand()*5; d.hum = 45 + rand()*25;
  d.leafState = 'unchecked'; d.weedState = 'unchecked'; d.chip = 'Waiting';
  d.hasWeed = p.weed; st.plant.weed.visible = p.weed; st.plant.weed.scale.set(1,1,1); st.plant.weed.rotation.set(0,0,0); st.plant.weedMat.color.setHex(0x8dbb3a);
  resetLeaves(st.plant);
  const front = st.plant.meta.map((m,i) => ({i, s:m.dir.z + (i > 1 && i < 9 ? .5 : -1)})).sort((a,b) => b.s - a.s).map(o => o.i);

function buildWorld(m){
  if(world){ scene.remove(world); world.traverse(o => { if(o.geometry) o.geometry.dispose(); if(o.material && o.material.dispose && !Object.values(mat).includes(o.material)) o.material.dispose(); }); }

  const nRows = m === 'farm' ? 3 : 1, nMods = m === 'farm' ? 3 : 1;
  const demo = [{m:24, weed:true, sick:0}, {m:41, weed:false, sick:2}, {m:30, weed:false, sick:0}, {m:27, weed:true, sick:1}];
  for(let ri=0; ri<nRows; ri++){
    const row = {group:new THREE.Group(), stations:[]}; row.group.position.z = -ri*ROW_PITCH; world.add(row.group);
    const rand = rng(ri*31 + 7);
    for(let mi=0; mi<nMods; mi++){

// ---------- motion ----------
let running = false, token = 0;
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const frame1 = () => new Promise(r => requestAnimationFrame(r));
async function wait(ms, my){ const t0 = performance.now(); while(performance.now() - t0 < ms/SPEED){ if(my !== token) return false; await frame1(); } return my === token; }
async function move(R, target, dur, my){
  const from = Object.assign({}, R.pose), keys = Object.keys(target).filter(k => k in R.pose);
  // every rotary joint takes the short way round, so no joint ever spins a full turn
  keys.forEach(k => { if(k[0] === 'j'){ let d = target[k] - from[k]; d = ((d % 360) + 540) % 360 - 180; target[k] = from[k] + d; } });
  let t = 0, last = performance.now();
  while(t < 1){
    if(my !== token) return false;
    await frame1(); const now = performance.now(); t = Math.min(1, t + (now - last)*SPEED/dur); last = now;
    const e = ease(t); keys.forEach(k => R.pose[k] = from[k] + (target[k] - from[k])*e); R.apply(); if(R === focus) syncUI();
  }
  keys.forEach(k => { if(k[0] === 'j') R.pose[k] = ((R.pose[k] % 360) + 540) % 360 - 180; });
  return my === token;
}

async function tend(R, st, my){
  const d = st.d, ok = v => v && my === token;
  R.current = st; R.panel = false; d.chip = 'Waiting';
  say(R, `Driving to ${st.id}`, 'live');
  if(!ok(await move(R, Object.assign({x:st.base.x}, stow(R)), 1700, my))) return false;

  // 1. read the QR tag, then open the plant's data
  say(R, `Reading the QR tag on ${st.id}`, 'live'); d.chip = 'Reading tag';
  // camera level with the tag: tool horizontal, lens at the tag's height, 15 cm in front of it
  const scanW = new THREE.Vector3(st.tag.x, st.tag.y - LENS_UP, st.tag.z + .15 + LENS_FWD[R.kind]);
  if(!ok(await move(R, solve(R, scanW, 0, st.tag.x), 1400, my))) return false;
  R.scanning = true; if(!ok(await wait(1100, my))) return false; R.scanning = false;
  st.ring.material.opacity = 1; R.panel = true; d.chip = 'Data loaded';
  say(R, `${st.id} found. Loading sensor data.`, 'live');
  if(!ok(await wait(900, my))) return false;

  // 2. camera inspects the leaves and soil
  say(R, 'Inspecting leaves and soil', 'live'); d.chip = 'Inspecting'; d.leafState = d.weedState = 'checking';
  const lin = R.kind === 'linear';
  const lookFrom = st.lvl === 0 ? new THREE.Vector3(st.base.x, lin ? .56 : .66, st.base.z + .46) : new THREE.Vector3(st.base.x, Math.min(st.base.y + .56, lin ? 1.30 : 1.40), st.base.z + .4);
  const focusPt = st.base.clone().add(new THREE.Vector3(0, .3, 0));
  const look = solve(R, lookFrom, Math.atan2(lookFrom.y - focusPt.y, lookFrom.z - focusPt.z)/deg, st.base.x);
  if(!ok(await move(R, look, 1300, my))) return false;
  R.scanning = true;
  if(!ok(await move(R, sweep(R, look, 1), 900, my))) return false;
  if(!ok(await move(R, sweep(R, look, -1), 1400, my))) return false;
  if(!ok(await move(R, sweep(R, look, 0), 700, my))) return false;
  R.scanning = false;
  d.leafState = d.sick.length ? 'found' : 'ok'; d.weedState = d.hasWeed ? 'found' : 'ok';
  const issues = [d.moist < d.target ? 'dry soil' : '', d.hasWeed ? 'a weed' : '', d.sick.length ? 'leaf spot' : ''].filter(Boolean);
  say(R, issues.length ? `Found ${issues.join(', ').replace(/, ([^,]*)$/, ' and $1')}` : 'Everything looks healthy', 'live');
  if(!ok(await wait(900, my))) return false;

  // 3. water until the moisture reaches target
  if(d.moist < d.target){
    say(R, `Watering until soil moisture reaches ${d.target}%`, 'water'); d.chip = 'Watering';
    if(!ok(await move(R, aim(R, st, st.base.clone().add(new THREE.Vector3(0,.17,.03)), 36, .12), 1200, my))) return false;
    const b = Object.assign({}, R.pose); R.spray = 'water'; let t = 0, lastT = performance.now();
    while(d.moist < d.target){
      if(my !== token){ R.spray = null; return false; }
      await frame1(); const nowT = performance.now(), dt = Math.min(.05, (nowT - lastT)/1000)*SPEED; lastT = nowT;
      t += dt; d.moist = Math.min(d.target, d.moist + 9*dt);
      if(R.kind === 'arm'){ R.pose.j1 = b.j1 + 6*Math.sin(t*2.2); R.pose.j5 = b.j5 + 10*Math.sin(t*3.1); }
      else { R.pose.x = b.x + .035*Math.sin(t*2.2); R.pose.tilt = b.tilt + 5*Math.sin(t*3.1); }
      R.apply();
    }
    R.spray = null; tally.watered++; setTally();
    if(!ok(await move(R, R.kind === 'arm' ? {j1:b.j1, j5:b.j5} : {x:b.x, tilt:b.tilt}, 400, my))) return false;
  } else { say(R, 'Soil moisture is fine. No water needed.', 'live'); if(!ok(await wait(800, my))) return false; }

  // 4. spot-spray the weed with a short burst
  if(d.hasWeed){
    say(R, 'Spot-spraying the weed', 'treat'); d.chip = 'Removing weed';
    const wt = st.base.clone().add(st.plant.weedTop);
    if(!ok(await move(R, aim(R, st, wt, 38, .08), 1200, my))) return false;
    R.spray = 'treat'; if(!ok(await wait(450, my))) { R.spray = null; return false; } R.spray = null;
    const w = st.plant.weed, wm = st.plant.weedMat, c0 = new THREE.Color(0x8dbb3a), c1 = new THREE.Color(0x6b4f1f);
    await animate(1500/SPEED, t => { wm.color.copy(c0).lerp(c1, Math.min(1, t*1.6)); w.scale.set(1, 1 - .7*t, 1); w.rotation.z = .5*t; });
    await animate(500/SPEED, t => w.scale.setScalar(.3*(1 - t) + .001));
    w.visible = false; d.hasWeed = false; d.weedState = 'removed'; tally.weeds++; setTally();
  }

  // 5. treat any leaves with spots
  if(d.sick.length){
    d.chip = 'Treating leaves';
    for(const li of d.sick){
      say(R, 'Treating a leaf with leaf spot', 'treat');
      const lt = st.base.clone().add(st.plant.meta[li].mid);
      if(!ok(await move(R, aim(R, st, lt, 22, .07), 1100, my))) return false;
      R.spray = 'treat'; if(!ok(await wait(380, my))) { R.spray = null; return false; } R.spray = null;
      healLeaf(st.plant, li); tally.leaves++; setTally();
      if(!ok(await wait(350, my))) return false;
    }
    if(!ok(await wait(1500, my))) return false;
    d.sick = []; d.leafState = 'treated';
  }
  d.chip = 'Healthy'; say(R, `${st.id} is healthy`, 'live'); tally.checked++; setTally();
  if(!ok(await wait(900, my))) return false;
  return true;
}
async function runRow(row, my, delay){
  const R = row.robot;
  if(!await wait(delay, my)) return;
  for(const st of row.stations){ if(!await tend(R, st, my)) return; }
  R.panel = false; say(R, 'Row finished. Returning to the charging spot.', 'live');
  if(!await move(R, Object.assign({x:row.home}, stow(R), homePose(R)), 1800, my)) return;
  say(R, 'Row complete. All plants checked and treated.');
}
async function runAll(){
  running = true; const my = ++token;
  $('run').textContent = 'Stop'; $('run').classList.add('stop'); setManual(null); setScan(false);
  if(rows.every(r => r.stations.every(st => st.d.chip === 'Healthy')))
    rows.forEach(r => r.stations.forEach(st => newDay(st, r.rand)));
  rows.forEach(r => r.stations.forEach(st => { st.ring.material.opacity = 0; st.d.leafState = st.d.weedState = 'unchecked'; st.d.chip = 'Waiting'; }));
  Object.assign(tally, {checked:0, watered:0, weeds:0, leaves:0}); setTally();
  await Promise.all(rows.map((r, i) => runRow(r, my, i*700)));
  if(my === token){ running = false; $('run').textContent = 'Run care cycle'; $('run').classList.remove('stop'); }
}
function stopAll(){
  running = false; token++; rows.forEach(r => { r.robot.spray = null; r.robot.scanning = false; say(r.robot, 'Stopped. Joints are yours to move.'); });
  $('run').textContent = 'Run care cycle'; $('run').classList.remove('stop');
}
$('run').onclick = () => running ? stopAll() : runAll();
$('speed').onclick = () => { SPEED = SPEED === 1 ? 2 : 1; $('speed').setAttribute('aria-pressed', SPEED === 2); };

let manual = null;
function setManual(kind){
  manual = kind; $('waterBtn').setAttribute('aria-pressed', kind === 'water'); $('treatBtn').setAttribute('aria-pressed', kind === 'treat');
  if(focus && !running){ focus.spray = kind; say(focus, kind === 'water' ? 'Spraying water.' : kind === 'treat' ? 'Spraying weed and leaf treatment.' : 'Idle.', kind || ''); }
}
function setScan(v){ $('scanBtn').setAttribute('aria-pressed', v); if(focus && !running) focus.scanning = v; }
$('waterBtn').onclick = () => { if(running) stopAll(); setManual(manual === 'water' ? null : 'water'); };
$('treatBtn').onclick = () => { if(running) stopAll(); setManual(manual === 'treat' ? null : 'treat'); };
$('scanBtn').onclick = () => { if(running) stopAll(); setScan($('scanBtn').getAttribute('aria-pressed') !== 'true'); };

// ---------- camera views ----------
const VIEWS = {
  single:{overview:{t:[.35,.72,.25], yaw:.42, pitch:.36, dist:3.6}, front:{t:[.2,.75,.2], yaw:0, pitch:.1, dist:3.7},
    side:{t:[.2,.7,.3], yaw:1.45, pitch:.16, dist:3.3}, top:{t:[.2,.3,.3], yaw:.2, pitch:1.35, dist:3.6}},
  farm:{overview:{t:[0,.5,-2.1], yaw:.55, pitch:.5, dist:9.5}, front:{t:[0,.8,-2.1], yaw:0, pitch:.18, dist:10},
    side:{t:[0,.6,-2.1], yaw:1.4, pitch:.2, dist:9}, top:{t:[0,0,-2.1], yaw:.1, pitch:1.4, dist:10}},
  tool:{yaw:.9, pitch:.35, dist:.95}
};
let view = 'overview';
const goal = {t:new THREE.Vector3(...VIEWS.single.overview.t), yaw:.42, pitch:.36, dist:3.6};
const cur = {t:goal.t.clone(), yaw:goal.yaw, pitch:goal.pitch, dist:goal.dist};
function setView(v){
  view = v; document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
  const p = v === 'tool' ? VIEWS.tool : VIEWS[mode][v];
  if(p.t) goal.t.set(...p.t); goal.yaw = p.yaw; goal.pitch = p.pitch; goal.dist = p.dist;
  if(reduce){ cur.t.copy(goal.t); Object.assign(cur, {yaw:goal.yaw, pitch:goal.pitch, dist:goal.dist}); }
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
$('farmBtn').onclick = () => {
  stopAll(); setManual(null); setScan(false);
  mode = mode === 'single' ? 'farm' : 'single';
  $('farmBtn').textContent = mode === 'farm' ? 'Show single module' : 'Show farm';
  $('farmBtn').setAttribute('aria-pressed', mode === 'farm');
  $('watch').hidden = mode !== 'farm'; $('title').textContent = mode === 'farm' ? 'Plant care farm' : 'Plant care cell';
  buildWorld(mode); setWatch(0); setView(view === 'tool' ? 'tool' : 'overview');
  rows.forEach(r => say(r.robot, mode === 'farm' ? 'Ready. Three rows, one robot each.' : 'Idle. Run a care cycle to start.'));
};
function setWatch(i){ focus = rows[i].robot; lastPanel = ''; document.querySelectorAll('[data-row]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.row === i)); syncUI(); }
document.querySelectorAll('[data-row]').forEach(b => b.onclick = () => setWatch(+b.dataset.row));
$('rigBtn').onclick = () => {
  stopAll(); setManual(null); setScan(false);
  RIG = RIG === 'arm' ? 'linear' : 'arm';
  $('rigBtn').textContent = RIG === 'arm' ? 'Switch to scissor lift' : 'Switch to 5-axis arm';
  $('rigBtn').setAttribute('aria-pressed', RIG === 'linear');
  rows.forEach(r => { const R = r.robot; setRig(R, RIG); Object.assign(R.pose, stow(R), homePose(R)); R.apply();
    say(R, RIG === 'arm' ? '5-axis arm fitted.' : 'Scissor lift with linear actuator fitted.'); });
  buildSliders(); syncUI(); lastPanel = '';
};

const ptrs = new Map(); let pinch0 = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); canvas.classList.add('dragging');
  if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x-b.x, a.y-b.y); } });
canvas.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if(ptrs.size === 1){ goal.yaw -= dx*.006; goal.pitch = Math.max(-.05, Math.min(1.45, goal.pitch + dy*.005)); cur.yaw = goal.yaw; cur.pitch = goal.pitch; }
  else if(ptrs.size === 2){ const [a,b] = [...ptrs.values()], d = Math.hypot(a.x-b.x, a.y-b.y); if(pinch0) goal.dist = Math.max(.4, Math.min(16, goal.dist*pinch0/d)); pinch0 = d; }
});
const endPtr = e => { ptrs.delete(e.pointerId); if(!ptrs.size) canvas.classList.remove('dragging'); pinch0 = 0; };
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { e.preventDefault(); goal.dist = Math.max(.4, Math.min(16, goal.dist*Math.exp(e.deltaY*.0012))); }, {passive:false});

// ---------- loop ----------
const feed = $('feed');
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
buildSliders(); buildWorld('single');
const eePos = new THREE.Vector3(), dry = new THREE.Color(0x7a5836), wet = new THREE.Color(0x2b1a0e);
let last = performance.now(), uiT = 0;
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  for(let i=anims.length-1; i>=0; i--){ const a = anims[i]; a.t = Math.min(1, a.t + dt*1000/a.dur); a.fn(a.t); if(a.t >= 1){ anims.splice(i,1); a.res(); } }
  rows.forEach(r => {
    const R = r.robot;
    if(R.spray) emit(R, R.spray, dt);
    const target = R.scanning ? .16 + .08*Math.sin(now*.012) : 0;
    R.cone.material.opacity += (target - R.cone.material.opacity)*.2;
    R.led.material.color.setHex(R.scanning && Math.sin(now*.02) > 0 ? 0x0f5a2c : 0x3be37f);
    r.stations.forEach(st => st.plant.soilMat.color.copy(dry).lerp(wet, Math.max(0, Math.min(1, (st.d.moist - 15)/50))));
  });
  stepParticles(dt);
  if((uiT += dt) > .08){ uiT = 0; renderPanel(); }

  if(view === 'tool' && focus){ focus.ee.getWorldPosition(eePos); goal.t.copy(eePos); }
  const k = reduce ? 1 : 1 - Math.exp(-dt*6);
  cur.t.lerp(goal.t, k); cur.yaw += (goal.yaw - cur.yaw)*k; cur.pitch += (goal.pitch - cur.pitch)*k; cur.dist += (goal.dist - cur.dist)*k;
  const d = cur.dist*(innerWidth/innerHeight < .9 ? 1.45 : 1);
  camera.position.set(cur.t.x + Math.sin(cur.yaw)*Math.cos(cur.pitch)*d, cur.t.y + Math.sin(cur.pitch)*d, cur.t.z + Math.cos(cur.yaw)*Math.cos(cur.pitch)*d);
  camera.lookAt(cur.t);

  renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.render(scene, camera);
  const rc = feed.getBoundingClientRect();
  if(rc.width > 0 && focus){
    focus.toolCam.aspect = rc.width/rc.height; focus.toolCam.updateProjectionMatrix();
    const y = innerHeight - rc.bottom;
    renderer.setScissorTest(true); renderer.setScissor(rc.left, y, rc.width, rc.height); renderer.setViewport(rc.left, y, rc.width, rc.height);
    renderer.setClearColor(0x2a3230, 1); renderer.clear();
    focus.cone.visible = false; renderer.render(scene, focus.toolCam); focus.cone.visible = true;
    renderer.setClearColor(0x000000, 0); renderer.setScissorTest(false);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
